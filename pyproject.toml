[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-fraud-detection"
version = "0.1.0"
description = "Agent-Accelerated Fraud Detection Pipeline with Partitioned PostgreSQL and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.18",
    "sqlalchemy>=2.0.28",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "langchain-anthropic>=0.1.4",
    "langchain-openai>=0.1.0",
    "faker>=24.0.0",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["EXE001", "EXE002"]

